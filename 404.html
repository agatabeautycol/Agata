<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Ágata Beauty</title>
  <meta name="robots" content="noindex">
  <style>
    /* Página de respaldo de GitHub Pages: se sirve en cualquier ruta, así que todo va en línea. */
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      background: #fcf3ec; color: #592510; text-align: center;
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wm { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 3rem; color: #643011; line-height: 1; margin: 0; }
    .wm span { display: block; font-family: "Dancing Script", cursive; font-size: 2rem; color: #a8604c; margin: -0.3rem 0 0 4rem; }
    p { margin: 1.25rem 0; }
    a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px; background: #643011; color: #fdf6f0; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #a8452a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="wm">ÁGATA<span>beauty</span></p>
    <p>No encontramos esta página. Te llevamos al catálogo…</p>
    <a id="home" href="/">Ir al catálogo</a>
  </main>
  <script>
    // En GitHub Pages el sitio vive en /<repositorio>/: se vuelve a esa raíz conservando búsqueda y filtros.
    const segment = location.pathname.split('/').filter(Boolean)[0];
    const home = (location.hostname.endsWith('github.io') && segment ? `/${segment}/` : '/') + location.search;
    document.getElementById('home').href = home;
    setTimeout(() => location.replace(home), 2500);
  </script>
</body>
</html>
